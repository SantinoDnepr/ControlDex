name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Keystore
        shell: bash
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/controldex.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/controldex.jks" >> "$GITHUB_ENV"
            echo "Підпис стабільним ключем"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задано — APK підписано тимчасовим debug-ключем"
          fi
      - name: Build
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong|Execution failed' -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ControlDex-v0.7-build${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
